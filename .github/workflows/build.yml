name: Build Android APKs

# Builds the release APKs of both flavors (normal: phones, tablets, TV, OUYA;
# automotive: Android Automotive OS) on every push. The project signs them with
# the debug key (source/app/build.gradle.kts); the ANDROID_DEBUG_KEYSTORE_BASE64
# secret (a debug.keystore, base64) is put where Gradle looks for that key, so
# each build installs over the one before. Without it, the runner's own debug
# key signs them.
# A successful build of the default branch is published as a GitHub release.
on:
  push:
    paths-ignore:
      - "**.md"
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  android:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    defaults:
      run:
        working-directory: source
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # source/gradlew needs an installed Gradle 8.13 (the repository has no wrapper jar)
      # (validate-wrappers off: the only wrapper jars are the old ones bundled
      # with SDL2's sample project, which the build does not use)
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"
          validate-wrappers: false

      # the versions source/app/build.gradle.kts asks for; local.properties in
      # the repository names its author's SDK
      - name: Android NDK and CMake
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "ndk;23.2.8568313" "cmake;3.22.1" > /dev/null
          echo "sdk.dir=$ANDROID_HOME" > local.properties

      - name: Signing key
        env:
          KEYSTORE: ${{ secrets.ANDROID_DEBUG_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE" ]; then
            mkdir -p ~/.android
            printf '%s' "$KEYSTORE" | base64 -d > ~/.android/debug.keystore
          else
            echo "::warning::no ANDROID_DEBUG_KEYSTORE_BASE64 secret: signed with the runner's debug key"
          fi

      - name: Build
        run: gradle --console=plain assembleNormalRelease assembleAutomotiveRelease

      - name: Collect
        run: |
          version="$(sed -n 's/^val androidVersionName = "\(.*\)"/\1/p' app/build.gradle.kts | head -n 1)"
          mkdir -p ../dist
          for flavor in normal automotive; do
            cp app/build/outputs/apk/$flavor/release/*.apk "../dist/Unreal-Android-$version-fr-$flavor-release.apk"
          done
          ls -l ../dist

      - uses: actions/upload-artifact@v4
        with:
          name: Unreal-Android-APK
          path: dist/*.apk
          retention-days: 14

      # a successful build of the default branch becomes a GitHub release
      # (build-<run number>, marked latest, the APKs attached); the last five
      # build-* releases are kept
      - name: Publish release
        if: github.event_name != 'pull_request' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        working-directory: ${{ github.workspace }}
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          MESSAGE: ${{ github.event.head_commit.message }}
        run: |
          tag="build-$GITHUB_RUN_NUMBER"
          subject="$(printf '%s' "${MESSAGE:-manual run}" | head -n 1)"
          printf '%s\n\nCommit: %s/%s/commit/%s\nBuild: %s/%s/actions/runs/%s\n' "$subject" \
            "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$GITHUB_SHA" "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID" > "$RUNNER_TEMP/notes.md"
          gh release create "$tag" dist/*.apk --target "$GITHUB_SHA" --latest \
            --title "Build $GITHUB_RUN_NUMBER (${GITHUB_SHA:0:7})" --notes-file "$RUNNER_TEMP/notes.md"
          gh release list --limit 100 --json tagName,createdAt \
            --jq '[.[] | select(.tagName | startswith("build-"))] | sort_by(.createdAt) | reverse | .[5:] | .[].tagName' |
          while read -r old; do
            gh release delete "$old" --cleanup-tag --yes
          done
